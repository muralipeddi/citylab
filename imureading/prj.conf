# CONFIG_BOOTLOADER_MCUBOOT=y
# CONFIG_STDOUT_CONSOLE=y
# CONFIG_GPIO=y
# CONFIG_SPI=y
# CONFIG_SENSOR=y

# Bootloader (keep if you’re using it)
CONFIG_BOOTLOADER_MCUBOOT=y

# Console via RTT
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# Optional (but helpful) logging to RTT
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y

# Disable UART console to avoid conflicts (Thingy:91X typically uses RTT)
CONFIG_UART_CONSOLE=n

# Sensors & drivers
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_BMI270=y          # make sure BMI270 driver is enabled

# Make RTT snappy & roomy
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=1024
CONFIG_SEGGER_RTT_MODE_BLOCK_IF_FIFO_FULL=y

# Stability helpers
CONFIG_ASSERT=y 
CONFIG_INIT_STACKS=y
CONFIG_MAIN_STACK_SIZE=4096

# Enable newlib for full printf/scanf
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y