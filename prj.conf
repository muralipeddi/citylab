# --- Application Memory ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# --- AWS IoT Configuration ---
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_SEC_TAG=16842753
CONFIG_AWS_IOT_APP_SUBSCRIPTION_LIST_COUNT=0
CONFIG_AWS_IOT_CLIENT_ID_STATIC="thingy91_logger"

# --- CHECK THIS CAREFULLY ---
CONFIG_AWS_IOT_BROKER_HOST_NAME="a2strbcs341z2h-ats.iot.us-east-2.amazonaws.com"

# Network Configuration for Hologram
CONFIG_PDN=y
CONFIG_PDN_DEFAULTS_OVERRIDE=y
CONFIG_PDN_DEFAULT_APN="hologram"
CONFIG_PDN_DEFAULT_FAM_IPV4=y

# Ensure the modem checks the external slot by default
# (You might still need the AT command once, but this helps stability)

# --- Networking ---
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# --- JSON ---
CONFIG_CJSON_LIB=y

# --- System & Libs ---
CONFIG_EVENTS=y
CONFIG_DATE_TIME=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_NCS_SAMPLES_DEFAULTS=y

# --- Modem & LTE ---
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=n
CONFIG_MODEM_INFO=y

# --- Power & Hardware ---
CONFIG_LTE_PSM_REQ=n
CONFIG_LTE_EDRX_REQ=n
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_ADP536X=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y