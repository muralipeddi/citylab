# --- Application Memory ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- ThingsBoard Settings ---
CONFIG_CLOUD_THINGSBOARD_COAP_ACCESS_TOKEN="Pi8oN67eIyA01b54Una4" 
CONFIG_CLOUD_THINGSBOARD_COAP_SERVER_HOSTNAME="34.230.157.229" #"coap.thingsboard.cloud"

# --- System & Libs ---
CONFIG_EVENTS=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_NCS_SAMPLES_DEFAULTS=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# --- Network & Modem ---
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

CONFIG_NRF_MODEM_LIB=y
CONFIG_DATE_TIME=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=n
CONFIG_MODEM_INFO=y

# --- High Speed Settings (Latency vs Battery trade-off) ---
# Disable PSM to ensure the modem is ready to send data every 200ms
CONFIG_LTE_PSM_REQ=n
CONFIG_LTE_EDRX_REQ=n

# --- Hardware Drivers ---
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y